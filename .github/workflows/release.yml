# 打 tag（v*）时自动发布 Release：先跑全量回归，再建 Release。
#
# 标题约定：Release 标题 = 「tag — 一句话描述」（对齐 v2.0.0 的历史格式），
#   取自**带注释 tag 的 subject**（`git tag -a v3.0.0 -m "v3.0.0 — 描述"`）；
#   轻量 tag（无注释）回落为 tag 名。
#
# ⚠️ 2026-10-16 实况纠正：**不能只用本地的
#   `git tag -l --format='%(contents:subject)' "$TAG"`**。runner 上本地 tag
#   未必是带注释形态（或没取到 tag 对象），此占位符会**静默退回被指向提交的主题**
#   —— v3.0.0 的 Release 标题因此一度变成 commit subject（"docs: 更正 v3.0.0 的
#   测试口径…"），而不是 tag 上写的那句话。现改为走 API 取注释对象：先看
#   `git/ref/tags/<tag>` 的 `object.type`，只有确为 `tag` 才去读它的 `message`；
#   任何一步失败都老实回落为 tag 名（宁可为空，不可为错）。
#
# ⚠️ 2026-10-16：SHA256 校验和**已弃用**，本工作流不再生成 SHA256SUMS.txt、
#   不再写进 Release 说明、也不再作为附件上传（历史 Release 的附件与正文段已清理）。
#   原因：清单 TARGETS 只覆盖 install.sh/ps1 与 7 个运行时模块中的 6 个
#   （漏 memory_config.py），与实际安装集不一致；而安装/更新流程不做校验，
#   继续维护这份清单的收益低于「清单与代码不同步」造成的误导风险。
#
# ⚠️ 2026-10-22：**安装器 exe 既随仓库分发，也挂 Release 附件**。
#   曾经试过「release.yml 加 windows-latest job 构建 + gh release upload」，
#   放弃的是**在 CI 里构建**这一步 —— exe 由本地 conda 环境打出，CI 构建的
#   产物与该 tag 的源码不是同一份事实源。现在改为：`dist/ai-memory-setup.exe`
#   （**仅 GUI 版**，CLI 版不入库）由 `.gitignore` 白名单放行、随提交入库；
#   Release 只做**搬运**，把仓库里那份原样挂成附件（不重新构建）。
#   ⇒ 打 tag 前请先本地跑一遍 `python build_exe.py gui` 再提交，否则挂上去的是旧包。
#
# ⚠️ 2026-10-22 追加约定：**web 仓（ai-memory-web）的 Release 也要带同一份 exe**
#   —— 两边用户拿到的是同一个安装器。该仓的 release.yml 从
#   `releases/latest/download/ai-memory-setup.exe` 拉取本仓附件后转挂，因此
#   **本仓必须先发布、web 仓后发布**，否则会拿到上一个版本的安装器。
#
# ⚠️ 2026-10-22 版本门禁：tag 名、`VERSION` 文件、CHANGELOG 首条三者必须一致，
#   任一不符直接判红（在跑测试之前）。此前版本事实源有三处却无人核对 ——
#   web 仓就出现过 `WEB_VERSION` 落后 tag 两个版本的漂移。`VERSION` 是本仓
#   **唯一**的机器可读版本源，改版本时与 CHANGELOG 一起改，别只改 tag。
#
# ⚠️ 2026-10-22 校验和：每个二进制附件同附 `<文件名>.sha256`（`sha256sum` 格式，
#   一行，只记裸文件名）。2026-10-16 弃用的是「多文件合并成 SHA256SUMS.txt」那种
#   清单，理由是清单与安装集不同步；逐文件 .sha256 无此问题，也便于 `sha256sum -c`。
#
# ⚠️ 2026-10-27 正文口径：Release 正文优先取 `.github/release-notes/<tag>.md`。
#   此前一律 `--generate-notes`，正文只有 "What's Changed" 和 PR 列表 —— 那是给
#   改代码的人看的，而 Release 正文的读者是**装了但不动代码的人**（他们要知道
#   「这版对我有什么变化、要不要重建索引、升级会不会覆盖配置」）。三仓现已统一：
#   docker 仓最先这么改，本仓与 web 仓跟进，保证同一版本的正文口径一致。
#   打 tag 前在 `.github/release-notes/<tag>.md` 写一份用户视角的说明；不写也能发，
#   但会退回自动生成，正文质量就是原来那样。
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify version consistency
        env:
          TAG: ${{ github.ref_name }}
        run: |
          V="${TAG#v}"
          if [ ! -f VERSION ]; then
            echo "::error::缺少 VERSION 文件（应只有一行版本号，如 3.1.2）"
            exit 1
          fi
          FILE_V="$(tr -d '[:space:]' < VERSION)"
          TOP="$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | tr -dc '0-9.')"
          echo "tag=$V  VERSION=$FILE_V  CHANGELOG=$TOP"
          if [ "$FILE_V" != "$V" ]; then
            echo "::error::VERSION($FILE_V) 与 tag($V) 不一致 —— 改版本时 VERSION 与 CHANGELOG 要一起改"
            exit 1
          fi
          if [ "$TOP" != "$V" ]; then
            echo "::error::CHANGELOG 首条 [$TOP] 与 tag($V) 不一致 —— 先在 CHANGELOG 顶部补一条 ## [$V] - 日期"
            exit 1
          fi

      - name: Run tests before publishing
        run: |
          pip install -r requirements-dev.txt
          for f in tests/test_*.py; do
            echo "::group::$f"
            python "$f"
            echo "::endgroup::"
          done
          # 管家自检是脚本式的（selftest_*.py），上面的遍历不覆盖，这里单列。
          for f in tests/selftest_*.py; do
            [ -e "$f" ] || continue
            echo "::group::$f"
            python "$f"
            echo "::endgroup::"
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          TITLE="$TAG"
          OBJ="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
                   --jq '.object.type + " " + .object.sha' 2>/dev/null || true)"
          KIND="${OBJ%% *}"; SHA="${OBJ##* }"
          if [ "$KIND" = "tag" ]; then
            MSG="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$SHA" \
                     --jq '.message' 2>/dev/null || true)"
            SUBJ="$(printf '%s\n' "$MSG" | head -n1)"
            if [ -n "$SUBJ" ]; then TITLE="$SUBJ"; fi
          fi
          echo "release title = $TITLE"
          NOTES_FILE=".github/release-notes/$TAG.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "release body = $NOTES_FILE（人工写，用户视角）"
            gh release create "$TAG" --title "$TITLE" --notes-file "$NOTES_FILE"
          else
            echo "release body = 自动生成（未提供 $NOTES_FILE）"
            gh release create "$TAG" --title "$TITLE" --generate-notes
          fi

      # 安装器只做「搬运」：把仓库里那份 dist/ai-memory-setup.exe 原样挂成附件，
      # 不在 CI 里重建（CI 构建的产物与该 tag 源码不是同一份事实源）。缺文件即红，
      # 避免出现「Release 建了但没安装器」这种静默残缺。
      # 同附 `.sha256`：在 dist/ 内 cd 后计算，文件里只记裸文件名，
      # 用户下载后 `sha256sum -c ai-memory-setup.exe.sha256` 可直接校验。
      - name: Attach installer exe
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ ! -f dist/ai-memory-setup.exe ]; then
            echo "::error::dist/ai-memory-setup.exe 不在仓库里 —— 打 tag 前先本地跑 python build_exe.py gui 并提交"
            exit 1
          fi
          ls -l dist/ai-memory-setup.exe
          ( cd dist && sha256sum ai-memory-setup.exe > ai-memory-setup.exe.sha256 )
          cat dist/ai-memory-setup.exe.sha256
          gh release upload "$TAG" dist/ai-memory-setup.exe dist/ai-memory-setup.exe.sha256 --clobber
          echo "attached: $(gh release view "$TAG" --json assets --jq '.assets[].name' | tr '\n' ' ')"
