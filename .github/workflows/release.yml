# 打 tag（v*）时自动发布 Release：先跑全量回归，再建 Release。
#
# 标题约定：Release 标题 = 「tag — 一句话描述」（对齐 v2.0.0 的历史格式）。
#   CI 取**带注释 tag 的 subject**（`git tag -a v2.7.0 -m "v2.7.0 — 描述"`）；
#   轻量 tag（无注释）自动回退为 tag 名，行为与从前一致。
#
# ⚠️ 2026-10-16：SHA256 校验和**已弃用**，本工作流不再生成 SHA256SUMS.txt、
#   不再写进 Release 说明、也不再作为附件上传（历史 Release 的附件与正文段已清理）。
#   原因：清单 TARGETS 只覆盖 install.sh/ps1 与 7 个运行时模块中的 6 个
#   （漏 memory_config.py），与实际安装集不一致；而安装/更新流程不做校验，
#   继续维护这份清单的收益低于「清单与代码不同步」造成的误导风险。
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests before publishing
        run: |
          pip install -r requirements-dev.txt
          for f in tests/test_*.py; do
            echo "::group::$f"
            python "$f"
            echo "::endgroup::"
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          TITLE="$(git tag -l --format='%(contents:subject)' "$TAG")"
          [ -n "$TITLE" ] || TITLE="$TAG"
          gh release create "$TAG" --title "$TITLE" --generate-notes
