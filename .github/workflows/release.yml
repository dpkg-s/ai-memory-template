# 打 tag（v*）时自动发布 Release：先跑全量回归 + 构建 Windows 安装器，再建 Release 并把
# 安装器作为**附件**挂上去（exe 不入 git 历史 —— 12 MB 二进制进历史会让仓库永久变胖，
# 每次重编都新增一份 blob；附件方式克隆开销为零，代价只是不在文件树里可见）。
#
# 标题约定：Release 标题 = 「tag — 一句话描述」（对齐 v2.0.0 的历史格式），
#   取自**带注释 tag 的 subject**（`git tag -a v3.0.0 -m "v3.0.0 — 描述"`）；
#   轻量 tag（无注释）回落为 tag 名。
#
# ⚠️ 2026-10-16 实况纠正：**不能只用本地的
#   `git tag -l --format='%(contents:subject)' "$TAG"`**。runner 上本地 tag
#   未必是带注释形态（或没取到 tag 对象），此占位符会**静默退回被指向提交的主题**
#   —— v3.0.0 的 Release 标题因此一度变成 commit subject（"docs: 更正 v3.0.0 的
#   测试口径…"），而不是 tag 上写的那句话。现改为走 API 取注释对象：先看
#   `git/ref/tags/<tag>` 的 `object.type`，只有确为 `tag` 才去读它的 `message`；
#   任何一步失败都老实回落为 tag 名（宁可为空，不可为错）。
#
# ⚠️ 2026-10-16：SHA256 校验和**已弃用**，本工作流不再生成 SHA256SUMS.txt、
#   不再写进 Release 说明、也不再作为附件上传（历史 Release 的附件与正文段已清理）。
#   原因：清单 TARGETS 只覆盖 install.sh/ps1 与 7 个运行时模块中的 6 个
#   （漏 memory_config.py），与实际安装集不一致；而安装/更新流程不做校验，
#   继续维护这份清单的收益低于「清单与代码不同步」造成的误导风险。
#
# ⚠️ 2026-10-22：安装器 exe 改为 Release 附件。要点：
#   1) **必须在 windows-latest 上构建** —— PyInstaller 不支持交叉编译，ubuntu runner
#      产不出可用的 Windows exe。
#   2) `build_exe.py` 会做 DLL 自检（tcl/tk/_tkinter.pyd），自检不过返回码 2 ⇒ job 失败
#      ⇒ 整个发布中断。这是有意的：宁可发不出，也不发一个在干净机器上启动即崩的包。
#   3) pyinstaller **不在 requirements-dev.txt 里**（本地构建才需要），此 job 单独装。
#   4) 附件上传用 `--clobber`，允许对同一 tag 重跑工作流时覆盖旧附件。
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Run regression tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: |
          pip install -r requirements-dev.txt
          for f in tests/test_*.py; do
            echo "::group::$f"
            python "$f"
            echo "::endgroup::"
          done

  installer:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install "pyinstaller>=6.0"

      - name: Build installer (GUI + CLI)
        run: python build_exe.py

      - name: Show artifacts
        run: Get-ChildItem dist -Filter *.exe | Format-Table Name, Length

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: [test, installer]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist

      - name: Create release and attach installer
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          TITLE="$TAG"
          OBJ="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
                   --jq '.object.type + " " + .object.sha' 2>/dev/null || true)"
          KIND="${OBJ%% *}"; SHA="${OBJ##* }"
          if [ "$KIND" = "tag" ]; then
            MSG="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$SHA" \
                     --jq '.message' 2>/dev/null || true)"
            SUBJ="$(printf '%s\n' "$MSG" | head -n1)"
            if [ -n "$SUBJ" ]; then TITLE="$SUBJ"; fi
          fi
          echo "release title = $TITLE"
          gh release create "$TAG" --title "$TITLE" --generate-notes
          ls -lh dist
          gh release upload "$TAG" dist/*.exe --clobber
