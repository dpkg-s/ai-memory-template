# ruff 配置：只聚焦真实错误（F 系列中的硬错误），
# 关闭风格类规则（E/W）与存量无害告警，避免对 1940 行存量代码产生噪音。

target-version = "py310"
line-length = 120

[lint]
select = ["F"]          # Pyflakes
ignore = [
    "F401",             # 未使用 import（类型标注与兼容性导入常见）
    "F541",             # f-string 无占位符（纯风格）
    "F841",             # 局部变量赋值未使用（存量代码，需逐个判断，不宜批量改）
]
