<!doctype html>
<html lang="zh-CN" data-theme="dark" data-theme-pref="auto">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="ai-memory 记忆库控制台 —— 调试台与配置面（v3.1）"
    />
    <title>记忆库控制台 · ai-memory</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230b0c0d'/%3E%3Cpath d='M10 20.5V11.5M16 23V9M22 20.5V11.5' stroke='%23dfe4e7' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <!--
      样式按层拆成 8 片（2026-10-15）。CSS 没有 import 那样的显式依赖，
      层叠顺序**就是**加载顺序，故顺序不可调换、不可改成按需加载。
      分片只按「同层内容 + 行号单调」两个约束切，原文件顺序 100% 保留。
    -->
    <link rel="stylesheet" href="/assets/css/1-tokens.css" />
    <link rel="stylesheet" href="/assets/css/2-layout.css" />
    <link rel="stylesheet" href="/assets/css/3-components.css" />
    <link rel="stylesheet" href="/assets/css/4-console.css" />
    <link rel="stylesheet" href="/assets/css/5-overlays.css" />
    <link rel="stylesheet" href="/assets/css/6-anim.css" />
    <link rel="stylesheet" href="/assets/css/7-views.css" />
    <link rel="stylesheet" href="/assets/css/8-responsive.css" />
    <script>
      /* 主题预设早于首帧生效，避免白/黑闪一下（FOUC）。
   ?theme=light|dark|auto 可作为深链覆盖（截图 / 分享 / 排障用），并写回 localStorage。 */
      (function () {
        try {
          var q = new URLSearchParams(location.search).get("theme");
          var pref =
            q === "light" || q === "dark" || q === "auto"
              ? q
              : localStorage.getItem("am.theme") || "auto";
          if (q) localStorage.setItem("am.theme", pref);
          var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var resolved = pref === "auto" ? (dark ? "dark" : "light") : pref;
          var el = document.documentElement;
          el.setAttribute("data-theme", resolved);
          el.setAttribute("data-theme-pref", pref);
        } catch (e) {
          /* 隐私模式下 localStorage 可能抛错，忽略 */
        }
      })();
      /* 启动失败兜底：静态资源缺失 / 前端脚本报错时，给出可见提示而不是白屏。
   4 秒后若 #app 仍是空的，就把捕获到的错误显示出来。
   ⚠️ 入口是 ES 模块：import 图里任何一个文件解析失败都会让整棵树不执行，
   此时浏览器在 window 上派发 error（e.target 指到出错的 script），本兜底同样覆盖。 */
      window.__amError = "";
      window.addEventListener("error", function (e) {
        window.__amError =
          (e && (e.message || (e.target && e.target.src))) || "unknown";
      });
      window.addEventListener("unhandledrejection", function (e) {
        window.__amError =
          (e && e.reason && (e.reason.message || String(e.reason))) ||
          "unhandled";
      });
      setTimeout(function () {
        var el = document.getElementById("app");
        if (el && el.children.length === 0) {
          el.innerHTML =
            '<div class="noscript">前端未能启动' +
            (window.__amError
              ? "：" + String(window.__amError)
              : "（请打开开发者工具查看错误）") +
            "</div>";
        }
      }, 4000);
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <div class="noscript">这个控制台需要 JavaScript 才能运行。</div>
    </noscript>

    <!--
      本地化第三方库（无 CDN、无构建步骤）。
      分三类加载，顺序有讲究：

      ① 普通脚本（同步执行，先于模块）：marked / DOMPurify / GSAP / Flip。
         前两者是 UMD，源码里按 `window.marked` / `window.DOMPurify` 取用；
         GSAP 与 Flip 同为 UMD，由 core/anim.js 通过 window.gsap 取用。

      ② 入口模块（type=module，默认 defer）：js/main.js。
         Vue 由 ESM 具名导入（vue.esm-browser.prod.js 比 global 版小 126 KB），
         import 图覆盖 core / features / components / views 共 31 个模块。

      ③ 模块在 ① 之后执行，故模块顶层读 window.marked 一定拿到值。
    -->
    <script src="/assets/vendor/marked.min.js"></script>
    <script src="/assets/vendor/purify.min.js"></script>
    <script src="/assets/vendor/gsap.min.js"></script>
    <script src="/assets/vendor/Flip.min.js"></script>
    <script type="module" src="/assets/js/main.js"></script>
  </body>
</html>
